# Configuração baseline compartilhada entre PostgreSQL 17.12 e PostgreSQL 18.7
# Mantida em paridade estrita com BASELINE_PG_CONF em lab05/src/executar_coleta.py
# e com as flags -c aplicadas em lab05/docker/docker-compose.yml.

max_connections = 100
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
checkpoint_timeout = 15min
max_wal_size = 1GB
synchronous_commit = on
logging_collector = off
log_min_messages = warning
